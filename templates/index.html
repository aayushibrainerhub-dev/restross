<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <!-- Modern font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="navbar">
            <div class="logo" style="display: flex; align-items: center; gap: 8px;">
                <img src="https://cdn-icons-png.flaticon.com/512/4712/4712139.png" alt="Logo" width="32" height="32" />
                <h1>DesignFlow AI</h1>
            </div>
            <div class="nav-links">
                <a href="#restaurants" class="nav-link" data-target="restaurants-view">Restaurants & Menu</a>
                <a href="#chat" class="nav-link active" data-target="chat-view">AI Assistant</a>
                <a href="/login" class="nav-link" style="color:#ef4444;" title="Sign out">
                    <i class="fa-solid fa-power-off"></i>
                </a>
            </div>
            <div class="status-indicator" id="health-status">
                <span class="dot checking"></span> Checking...
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Restaurants View -->
            <section id="restaurants-view" class="view" style="display: none;">
                <div class="section-header">
                    <h2>Top 10 Rated Restaurants</h2>
                    <button class="btn-primary" id="refresh-restaurants">Refresh Data</button>
                </div>
                <div id="restaurants-grid" class="grid">
                    <!-- Cards will be dynamically injected here -->
                    <div class="loading-state">Loading restaurants...</div>
                </div>
            </section>

            <!-- Chat View -->
            <section id="chat-view" class="view active">
                <div class="chat-container">
                    <div id="chat-messages" class="chat-messages full-chat">
                        <div class="message-wrapper bot-wrapper">
                            <img src="https://cdn-icons-png.flaticon.com/512/4712/4712139.png" class="avatar" alt="AI">
                            <div class="message-content-container">
                                <div class="message-header">
                                    <span class="name">DesignPilot AI</span>
                                    <span class="time">Just now</span>
                                </div>
                                <div class="message bot">
                                    <div class="markdown-body">
                                        <p>Hi! What would you like help with?</p>
                                    </div>
                                    <div class="starter-prompts" aria-label="Suggested questions">
                                        <button type="button" class="starter-prompt" data-prompt="How can I order a meal?">1. Order a meal</button>
                                        <button type="button" class="starter-prompt" data-prompt="I'm not sure what to eat. Help me decide based on our chat.">2. Help me choose what to eat</button>
                                        <button type="button" class="starter-prompt" data-prompt="Show me the top 5 cafes.">3. Show the top 5 cafés</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="chat-input-container">
                        <form id="chat-form" class="chat-input-area">
                            <button type="button" class="btn-icon" aria-label="Attach file">
                                <i class="fa-solid fa-paperclip"></i>
                            </button>
                            <input type="text" id="chat-input" placeholder="Ask anything about restaurants, menus, or AI..." required autocomplete="off">
                            <button type="button" class="btn-icon" aria-label="Voice input">
                                <i class="fa-solid fa-microphone"></i>
                            </button>
                            <button type="submit" class="btn-send" aria-label="Send message">
                                <i class="fa-solid fa-arrow-up"></i>
                            </button>
                        </form>
                        <div class="disclaimer">
                            DesignPilot AI can make mistakes. Check our Terms & Conditions.
                        </div>
                    </div>
                </div>
            </section>
        </main>

    </div>

    <!-- Custom JS -->
    <script src="/static/js/app.js"></script>
</body>
</html>
