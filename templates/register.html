<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – Restros</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>

<div class="wrapper">

    <!-- Subtle Background Line Art -->
    <div class="bg-geo-lines">
        <svg viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <polygon points="100,50 900,200 600,900" />
            <polygon points="50,400 450,100 850,700" />
            <circle cx="250" cy="500" r="180" />
        </svg>
    </div>

    <!-- Navigation Bar -->
    <header class="nav-header">
        <a href="/" class="brand-logo">
            <div class="logo-symbol">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 5L35 32H5L20 5Z" stroke="#2A2421" stroke-width="3" stroke-linejoin="round"/>
                    <circle cx="25" cy="27" r="7" stroke="#2A2421" stroke-width="2.5" fill="none"/>
                </svg>
            </div>
        </a>
        <nav class="nav-right">
            <a href="/dashboard" class="nav-link">What we offer</a>
            <a href="/login" class="nav-link">Login</a>
            <a href="/register" class="nav-btn-signup" style="background-color: var(--accent-orange);">Sign Up</a>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="main-container">

        <!-- Left: Floating Food Dishes Showcase -->
        <section class="food-showcase">
            <div class="vertical-tan-band"></div>

            <div class="dish-item dish-crepes" title="Sweet Strawberry Crepes">
                <img src="/static/img/crepes.png" alt="Crepes with strawberries">
            </div>

            <div class="dish-item dish-dumplings" title="Steamed Dim Sum Dumplings">
                <img src="/static/img/dumplings.png" alt="Dumplings in wooden bowl">
            </div>

            <div class="dish-item dish-dessert" title="Berry Smoothie Dessert Bowl">
                <img src="/static/img/dessert.png" alt="Berry smoothie dessert bowl">
            </div>
        </section>

        <!-- Right: Auth Form Section -->
        <section class="auth-content">
            <div class="hero-header">
                <h1 class="hero-title">Hungry for Success?</h1>
                <p class="hero-subtitle">Create your Restros account today !</p>
            </div>

            <div class="auth-card">
                <div class="alert-message" id="alert-box"></div>

                <form id="reg-form" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="full_name">Full Name</label>
                        <div class="input-container">
                            <input type="text" id="full_name" placeholder="Jane Doe" autocomplete="name">
                        </div>
                        <span class="field-error-text" id="name-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email address</label>
                        <div class="input-container">
                            <input type="email" id="email" placeholder="name@company.com" autocomplete="email">
                        </div>
                        <span class="field-error-text" id="email-error"></span>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="input-container">
                                <input type="password" id="password" placeholder="Min. 8 chars" autocomplete="new-password">
                                <button type="button" class="toggle-pwd-btn" id="toggle-pwd" aria-label="Toggle password visibility">
                                    <svg id="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <svg id="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
                                    </svg>
                                </button>
                            </div>
                            <span class="field-error-text" id="pwd-error"></span>
                        </div>

                        <div class="form-group">
                            <label for="confirm">Confirm</label>
                            <div class="input-container">
                                <input type="password" id="confirm" placeholder="Repeat password" autocomplete="new-password">
                            </div>
                            <span class="field-error-text" id="confirm-error"></span>
                        </div>
                    </div>

                    <!-- Password strength bar -->
                    <div class="strength-container" id="strength-container">
                        <div class="strength-track"><div class="strength-fill" id="strength-fill"></div></div>
                        <span class="strength-text" id="strength-text"></span>
                    </div>

                    <div class="form-group">
                        <label for="role">Account Role</label>
                        <div class="input-container">
                            <select id="role">
                                <option value="staff">Staff Member</option>
                                <option value="manager">Restaurant Manager</option>
                                <option value="admin">Administrator</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="submit-btn">
                        <div class="loading-spinner" id="spinner"></div>
                        <span id="btn-text">Create Account</span>
                    </button>
                </form>

                <p class="auth-switch-text">Already have an account? <a href="/login">Sign in</a></p>
            </div>
        </section>

    </main>

</div>

<script>
const form         = document.getElementById('reg-form');
const alertBox     = document.getElementById('alert-box');
const submitBtn    = document.getElementById('submit-btn');
const btnText      = document.getElementById('btn-text');
const spinner      = document.getElementById('spinner');
const togglePwd    = document.getElementById('toggle-pwd');
const pwdInput     = document.getElementById('password');
const strengthBox  = document.getElementById('strength-container');
const strengthFill = document.getElementById('strength-fill');
const strengthText = document.getElementById('strength-text');

togglePwd.addEventListener('click', () => {
    const isPwd = pwdInput.type === 'password';
    pwdInput.type = isPwd ? 'text' : 'password';
    document.getElementById('eye-show').style.display = isPwd ? 'none' : 'block';
    document.getElementById('eye-hide').style.display = isPwd ? 'block' : 'none';
});

pwdInput.addEventListener('input', () => {
    const val = pwdInput.value;
    if (!val) { strengthBox.style.display = 'none'; return; }
    strengthBox.style.display = 'flex';

    let score = 0;
    if (val.length >= 8)           score++;
    if (/[A-Z]/.test(val))         score++;
    if (/[0-9]/.test(val))         score++;
    if (/[^A-Za-z0-9]/.test(val))  score++;

    const labels = ['Weak', 'Fair', 'Good', 'Strong'];
    const colors = ['#E53935', '#F57C00', '#29B6F6', '#2E7D32'];

    strengthFill.style.width = ((score / 4) * 100) + '%';
    strengthFill.style.backgroundColor = colors[score - 1] || '#E53935';
    strengthText.textContent = labels[score - 1] || 'Too short';
    strengthText.style.color = colors[score - 1] || '#E53935';
});

function showAlert(msg, type) {
    alertBox.textContent = msg;
    alertBox.className = 'alert-message ' + (type === 'success' ? 'success' : 'error');
}

function setLoading(loading) {
    submitBtn.disabled = loading;
    btnText.textContent = loading ? 'Creating account…' : 'Create Account';
    spinner.style.display = loading ? 'block' : 'none';
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.className = 'alert-message';
    document.querySelectorAll('input').forEach(i => i.classList.remove('is-invalid'));
    document.querySelectorAll('.field-error-text').forEach(s => s.textContent = '');

    const name     = document.getElementById('full_name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = pwdInput.value;
    const confirm  = document.getElementById('confirm').value;
    const role     = document.getElementById('role').value;
    let isValid    = true;

    if (!name) {
        document.getElementById('name-error').textContent = 'Full name is required.';
        document.getElementById('full_name').classList.add('is-invalid');
        isValid = false;
    }
    if (!email) {
        document.getElementById('email-error').textContent = 'Enter a valid email address.';
        document.getElementById('email').classList.add('is-invalid');
        isValid = false;
    }
    if (password.length < 8) {
        document.getElementById('pwd-error').textContent = 'Minimum 8 characters.';
        pwdInput.classList.add('is-invalid');
        isValid = false;
    }
    if (password !== confirm) {
        document.getElementById('confirm-error').textContent = 'Passwords do not match.';
        document.getElementById('confirm').classList.add('is-invalid');
        isValid = false;
    }

    if (!isValid) return;

    setLoading(true);
    try {
        const res = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, full_name: name, password, role }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Registration failed');
        
        if (data.access_token) {
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('user', JSON.stringify(data.user));
        }

        showAlert('Account created! Welcome, ' + (data.user ? data.user.full_name : name) + '. Redirecting to login…', 'success');
        setTimeout(() => window.location.href = '/login', 1500);
    } catch (err) {
        showAlert(err.message, 'error');
    } finally {
        setLoading(false);
    }
});
</script>
</body>
</html>
